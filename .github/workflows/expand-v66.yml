name: Expand v66 source

on:
  push:
    branches: [v66-test]
    paths:
      - 'v66-source.b64.*'
      - '.github/workflows/expand-v66.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-test
          fetch-depth: 0
      - name: Assemble and expand source archive
        shell: bash
        run: |
          set -euo pipefail
          cat v66-source.b64.* | base64 -d > v66-source.zip
          rm -rf .v66-extract
          mkdir .v66-extract
          unzip -q -o v66-source.zip -d .v66-extract
          cp -a .v66-extract/. ./
          rm -rf .v66-extract v66-source.zip
      - name: Commit expanded files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes.'
            exit 0
          fi
          git commit -m 'Expand v66 source for test deployment'
          git push origin HEAD:v66-test
