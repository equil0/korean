name: Patch v10.11 FROZEN one-call set pipeline v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-frozen-set-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply one-call FROZEN set pipeline v5
        run: python3 .github/run_patch_frozen_set_v5_retry.py
      - name: TypeScript syntax check
        run: |
          npx --yes esbuild v66-backend/backend/index.ts --platform=neutral --format=esm --log-level=warning --outfile=/tmp/index.js
      - name: Commit engine patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Use one-call v10.11 FROZEN set generation pipeline'
          git push origin HEAD:main
