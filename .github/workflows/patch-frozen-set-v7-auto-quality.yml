name: Patch v10.11 FROZEN v7 automatic quality repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-frozen-set-v7-auto-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply FROZEN v7 automatic quality repair
        run: python3 .github/patch_frozen_set_v7_auto_quality.py
      - name: TypeScript syntax check
        run: |
          npx --yes esbuild v66-backend/backend/index.ts --platform=neutral --format=esm --log-level=warning --outfile=/tmp/index.js
      - name: Commit engine patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Add automatic FROZEN quality gate and targeted repair'
          git push origin HEAD:main
