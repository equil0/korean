name: Patch v10.11 FROZEN set pipeline v3

on:
  push:
    branches: [main]
    paths:
      - '.github/patch_frozen_set_v3.py'
      - '.github/workflows/patch-frozen-set-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply FROZEN set pipeline v3
        run: python3 .github/patch_frozen_set_v3.py
      - name: TypeScript syntax check
        run: npx -y esbuild@0.25.9 v66-backend/backend/index.ts --format=esm --platform=neutral --outfile=/tmp/index-check.js
      - name: Commit engine patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Use bounded v10.11 FROZEN set generation pipeline'
          git push origin HEAD:main
