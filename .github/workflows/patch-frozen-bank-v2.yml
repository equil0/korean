name: Patch v10.11 FROZEN bank convergence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-frozen-bank-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix FROZEN negative-stem planner
        run: python3 .github/fix_frozen_negative_helper.py
      - name: Commit engine hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Fix v10.11 FROZEN negative-stem planner scope'
          git push origin HEAD:main
