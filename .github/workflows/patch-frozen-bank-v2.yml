name: Patch v10.11 FROZEN bank convergence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-frozen-bank-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch FROZEN bank planning
        run: python3 .github/patch_frozen_v2.py
      - name: Commit engine patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Make v10.11 FROZEN bank generation deficit-aware'
          git push origin HEAD:main
