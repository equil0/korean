name: Patch adaptive generation v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-adaptive-generation-v8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply adaptive generation patch
        run: python3 .github/patch_adaptive_generation_v8.py
      - name: TypeScript syntax check
        run: |
          npx --yes esbuild v66-backend/backend/index.ts --platform=neutral --format=esm --log-level=warning --outfile=/tmp/index.js
      - name: Commit engine patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Add true adaptive question prefetch generation'
          git push origin HEAD:main
