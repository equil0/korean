name: Patch v10.11 FROZEN compact set pipeline v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-frozen-set-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply FROZEN compact set pipeline v4
        run: python3 .github/patch_frozen_set_v4.py
      - name: TypeScript syntax check
        run: npx --yes esbuild v66-backend/backend/index.ts --format=esm --platform=neutral --log-level=error --outfile=/tmp/frozen-v4-check.js
      - name: Commit engine patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Use compact bounded v10.11 FROZEN set pipeline v4'
          git push origin HEAD:main
