name: Hotfix FROZEN set v3 progress labels

on:
  push:
    branches: [main]
    paths:
      - '.github/hotfix_frozen_set_v3_labels.py'
      - '.github/workflows/hotfix-frozen-set-v3-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch labels
        run: python3 .github/hotfix_frozen_set_v3_labels.py
      - name: TypeScript syntax check
        run: npx -y esbuild@0.25.9 v66-backend/backend/index.ts --format=esm --platform=neutral --outfile=/tmp/index-check.js
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v66-backend/backend/index.ts
          git commit -m 'Show FROZEN set QA as auditing'
          git push origin HEAD:main
